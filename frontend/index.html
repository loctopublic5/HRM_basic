<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HRM System Enterprise</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div id="login-view" class="d-none" style="height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-body);">
        </div>

    <div id="app" class="app-container d-none">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fa-solid fa-layer-group" style="margin-right: 10px;"></i> <span>HRM Pro</span>
            </div>
            <nav class="sidebar-nav">
                <a class="nav-link active" data-module="employeeManagement"><i class="fa-solid fa-users"></i> <span> Nhân viên</span> </a>
                <a class="nav-link" data-module="departments"><i class="fa-solid fa-building"></i> <span> Phòng ban</span></a>
                <a class="nav-link" data-module="positions"><i class="fa-solid fa-briefcase"></i> <span> Vị trí</span></a>
                <a class="nav-link" data-module="attendance"><i class="fa-solid fa-clock"></i> <span> Chấm công</span></a>
                <a class="nav-link" data-module="salary"><i class="fa-solid fa-money-bill-wave"></i><span> Lương thưởng</span> </a>
                <a class="nav-link" data-module="dashboard"><i class="fa-solid fa-chart-pie"></i> <span> Dashboard</span></a>
            </nav>
            <div class="sidebar-footer">
        <button id="sidebar-toggle" title="Thu gọn">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
    </div>
            </aside>

        <div class="main-area">
            <header class="header">
                <div id="page-title" style="font-weight: 600;">Trang chủ</div>
                <div class="user-info">
                    <span id="user-display-name" style="margin-right: 10px;">Admin</span>
                    <button id="logout-btn" class="btn btn-outline btn-sm"><i class="fa-solid fa-right-from-bracket"></i></button>
                </div>
            </header>

            <main id="main-content" class="main-content">
                </main>
        </div>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <div id="modal-overlay" class="modal-overlay">
        <div class="modal-container">
            <div class="card-header">
                <span id="modal-title">Tiêu đề Modal</span>
                <button class="btn btn-outline btn-sm" onclick="document.getElementById('modal-overlay').classList.remove('open')"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modal-body" class="card-body"></div>
            <div id="modal-footer" class="card-body" style="padding-top: 0; text-align: right; border-top: none;"></div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
